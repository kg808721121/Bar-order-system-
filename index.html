<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>THE ALTERED STATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050505;
    --bg-surface:#121110;
    --bg-surface-2:#1c1a17;
    --bg-surface-3:#272420;
    --line:#3a331f;
    --line-soft:#221f16;
    --text:#f5efdc;
    --text-muted:#b3a67e;
    --text-faint:#7d7355;
    --gold:#b8912c;
    --gold-bright:#e8c15f;
    --gold-dim:#6e5420;
    --status-pending-bg:#332a10;
    --status-pending-fg:#e8c04a;
    --status-done-bg:#14261a;
    --status-done-fg:#82c98d;
    --danger:#a13f3f;
    --danger-bright:#c96060;
    --shadow: 0 12px 36px rgba(0,0,0,.6);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --font-display:'Fraunces', 'Noto Serif TC', serif;
    --font-body:'Work Sans', 'PingFang TC', 'Microsoft JhengHei', 'Heiti TC', sans-serif;
    --font-mono:'Space Mono', 'Noto Sans Mono TC', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(184,145,44,.13), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(184,145,44,.09), transparent 55%);
    background-attachment:fixed;
  }
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;}
  p{margin:0;}
  button{font-family:inherit;}
  ::selection{background:var(--gold-dim);color:var(--text);}
  :focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}
  }

  .screen{max-width:640px;margin:0 auto;padding:0 0 96px;min-height:100vh;position:relative;}
  .screen.host{max-width:1080px;}

  /* ---------- Guest header ---------- */
  .g-hero{
    padding:44px 20px 28px;
    text-align:center;
    border-bottom:1px solid var(--line-soft);
    position:relative;
  }
  .g-hero .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold);
    display:block;
    margin-bottom:14px;
  }
  .g-hero h1{
    font-size:clamp(24px,6.2vw,36px);
    color:var(--gold-bright);
    letter-spacing:.03em;
    line-height:1.2;
  }
  .g-hero .sub{
    margin-top:12px;
    color:var(--text-muted);
    font-size:14.5px;
    font-style:italic;
    letter-spacing:.01em;
  }

  .g-name-bar{
    margin:20px 20px 0;
    background:var(--bg-surface);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .g-name-bar.greeting{justify-content:space-between;}
  .g-name-bar input[type=text]{
    flex:1;
    background:transparent;
    border:none;
    color:var(--text);
    font-size:16px;
    font-family:var(--font-body);
    padding:6px 2px;
  }
  .g-name-bar input[type=text]::placeholder{color:var(--text-faint);}
  .g-name-bar .greet-name{
    font-family:var(--font-display);
    font-size:17px;
    color:var(--gold-bright);
  }
  .btn{
    appearance:none;border:1px solid var(--gold-dim);
    background:linear-gradient(180deg, var(--gold-bright), var(--gold) 55%, #8a6a20);
    color:#1a1409;
    font-weight:700;
    font-size:14px;
    padding:11px 18px;
    border-radius:999px;
    cursor:pointer;
    letter-spacing:.02em;
    transition:filter .15s ease, transform .1s ease;
    white-space:nowrap;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  .btn-ghost{
    appearance:none;background:transparent;border:1px solid var(--line);
    color:var(--text-muted);font-size:13px;padding:9px 14px;border-radius:999px;cursor:pointer;
  }
  .btn-ghost:hover{border-color:var(--gold-dim);color:var(--text);}
  .btn-danger{background:linear-gradient(180deg, var(--danger-bright), var(--danger));color:#2a0e08;border-color:#7a3627;}
  .btn-sm{padding:7px 13px;font-size:12.5px;}
  .btn-block{width:100%;}

  /* ---------- Menu ---------- */
  .menu-list{padding:24px 20px 8px;display:flex;flex-direction:column;gap:14px;}
  .drink-card{
    background:var(--bg-surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
  }
  .drink-info h3{font-size:19px;color:var(--text);letter-spacing:.01em;}
  .drink-info .desc{margin-top:6px;color:var(--text-muted);font-size:13.5px;line-height:1.55;}
  .drink-info .desc .dot{color:var(--gold-dim);margin:0 6px;}
  .drink-order-btn{flex:0 0 auto;}
  .drink-actions{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;align-items:stretch;}
  .vote-select{
    appearance:none;-webkit-appearance:none;
    background:var(--bg-surface-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0L5 6L10 0Z' fill='%23a99878'/></svg>") no-repeat right 12px center;
    border:1px solid var(--line);
    color:var(--text-muted);
    font-family:var(--font-mono);
    font-size:12px;
    padding:9px 28px 9px 14px;
    border-radius:999px;
    cursor:pointer;
    text-align:center;
    white-space:nowrap;
  }
  .vote-select:hover{border-color:var(--gold-dim);color:var(--text);}
  .vote-select:focus-visible{border-color:var(--gold-bright);}

  .empty-note{
    margin:20px;padding:22px;text-align:center;color:var(--text-faint);
    border:1px dashed var(--line);border-radius:var(--radius-md);font-size:13.5px;
  }

  /* ---------- My orders ---------- */
  .my-orders{margin:6px 20px 0;}
  .my-orders summary{
    cursor:pointer;color:var(--text-muted);font-size:13px;font-family:var(--font-mono);
    padding:14px 4px;list-style:none;display:flex;align-items:center;gap:8px;
  }
  .my-orders summary::-webkit-details-marker{display:none;}
  .my-orders summary::before{content:'▸';color:var(--gold);transition:transform .15s;}
  .my-orders[open] summary::before{transform:rotate(90deg);}
  .ticket-row{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;background:var(--bg-surface);border:1px solid var(--line-soft);
    border-radius:var(--radius-sm);margin-bottom:8px;
  }
  .ticket-num{font-family:var(--font-mono);color:var(--gold);font-size:13px;min-width:34px;}
  .ticket-main{flex:1;min-width:0;}
  .ticket-main .name{font-size:14.5px;color:var(--text);}
  .ticket-main .drink{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
  .pill{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;padding:5px 10px;border-radius:999px;
    white-space:nowrap;
  }
  .pill.pending{background:var(--status-pending-bg);color:var(--status-pending-fg);}
  .pill.done{background:var(--status-done-bg);color:var(--status-done-fg);}

  /* ---------- Host trigger + footer ---------- */
  .host-fab{
    position:fixed;right:16px;bottom:16px;
    width:46px;height:46px;border-radius:50%;
    background:var(--bg-surface-2);border:1px solid var(--line);
    color:var(--text-faint);font-size:18px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:var(--shadow);
    z-index:40;
  }
  .host-fab:hover{color:var(--gold);border-color:var(--gold-dim);}

  .footer-note{text-align:center;color:var(--text-faint);font-size:11.5px;padding:26px 20px 0;font-family:var(--font-mono);}

  /* ---------- Modal / PIN pad ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(10,8,5,.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal{
    background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:28px 24px 24px;max-width:340px;width:100%;box-shadow:var(--shadow);
  }
  .modal h2{font-size:20px;text-align:center;color:var(--text);}
  .modal .modal-sub{text-align:center;color:var(--text-muted);font-size:13px;margin-top:6px;}
  .pin-dots{display:flex;justify-content:center;gap:14px;margin:22px 0;}
  .pin-dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--gold-dim);background:transparent;transition:background .1s;}
  .pin-dot.filled{background:var(--gold);}
  .pin-dot.err{background:var(--danger);border-color:var(--danger);}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .keypad button{
    height:58px;border-radius:var(--radius-md);border:1px solid var(--line);
    background:var(--bg-surface-2);color:var(--text);font-family:var(--font-mono);font-size:20px;cursor:pointer;
  }
  .keypad button:active{background:var(--bg-surface-3);}
  .keypad button.wide{font-size:13px;color:var(--text-muted);}
  .modal-close{display:block;margin:18px auto 0;background:none;border:none;color:var(--text-faint);font-size:13px;cursor:pointer;}

  /* ---------- Toast ---------- */
  #toast-root{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;padding:0 16px;pointer-events:none;}
  .toast{
    background:var(--bg-surface-3);border:1px solid var(--gold-dim);color:var(--text);
    padding:12px 20px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);
    animation:toast-in .18s ease-out;
  }
  .toast.err{border-color:var(--danger);}
  @keyframes toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}

  .banner{
    margin:16px 20px 0;padding:12px 16px;border-radius:var(--radius-sm);
    background:var(--status-pending-bg);color:var(--status-pending-fg);font-size:12.5px;text-align:center;
    border:1px solid var(--gold-dim);
  }
  .banner.readonly{background:#2a2018;color:var(--text-muted);border-color:var(--line);}

  /* ---------- Host dashboard ---------- */
  .host-top{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
    padding:26px 24px 18px;border-bottom:1px solid var(--line-soft);
  }
  .host-top h1{font-size:24px;}
  .host-top .venue-tag{font-family:var(--font-mono);font-size:11px;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;}
  .stat-row{display:flex;gap:10px;padding:18px 24px 0;flex-wrap:wrap;}
  .stat-tile{
    background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:14px 20px;min-width:110px;flex:1;
  }
  .stat-tile .num{font-family:var(--font-mono);font-size:26px;color:var(--text);font-variant-numeric:tabular-nums;}
  .stat-tile .lbl{font-size:11.5px;color:var(--text-muted);margin-top:2px;letter-spacing:.03em;}
  .stat-tile.accent .num{color:var(--gold-bright);}

  .tabs{display:flex;gap:6px;padding:18px 24px 0;flex-wrap:wrap;}
  .tab-btn{
    background:transparent;border:1px solid var(--line);color:var(--text-muted);
    padding:9px 16px;border-radius:999px;font-size:13.5px;cursor:pointer;
  }
  .tab-btn.active{background:var(--bg-surface-2);border-color:var(--gold-dim);color:var(--gold-bright);}

  .host-body{padding:20px 24px 60px;}

  .queue-section h2{font-size:15px;color:var(--text-muted);letter-spacing:.05em;margin-bottom:12px;font-family:var(--font-mono);text-transform:uppercase;}
  .queue-list{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;}

  .rating-list{display:flex;flex-direction:column;gap:12px;}
  .rating-row{
    background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:16px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .rating-name{font-family:var(--font-display);font-size:16px;color:var(--text);min-width:170px;flex:0 0 auto;}
  .rating-bar-track{
    flex:1;min-width:120px;height:10px;background:var(--bg-surface-2);border:1px solid var(--line-soft);
    border-radius:999px;overflow:hidden;
  }
  .rating-bar-fill{
    height:100%;min-width:2px;background:linear-gradient(90deg, var(--gold-dim), var(--gold-bright));
    border-radius:999px;
  }
  .rating-value{font-family:var(--font-mono);color:var(--gold-bright);font-size:15px;min-width:42px;text-align:right;flex:0 0 auto;}
  .rating-count{font-family:var(--font-mono);color:var(--text-faint);font-size:11.5px;min-width:56px;text-align:right;flex:0 0 auto;}
  .rating-breakdown{width:100%;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);letter-spacing:.02em;}

  .lead-row{
    display:flex;align-items:center;gap:12px;background:var(--bg-surface);border:1px solid var(--line);
    border-radius:var(--radius-md);padding:12px 16px;
  }
  .lead-rank{font-family:var(--font-mono);color:var(--gold);font-size:14px;min-width:26px;}
  .lead-drink{font-family:var(--font-display);font-size:15px;color:var(--text);flex:1;min-width:0;}
  .lead-guest{font-size:12.5px;color:var(--text-muted);white-space:nowrap;}
  .lead-time{font-family:var(--font-mono);color:var(--gold-bright);font-size:13.5px;white-space:nowrap;min-width:64px;text-align:right;}
  .queue-row{
    display:flex;align-items:center;gap:16px;background:var(--bg-surface);border:1px solid var(--line);
    border-radius:var(--radius-md);padding:14px 18px;
  }
  .queue-row .tnum{font-family:var(--font-mono);color:var(--gold);font-size:15px;min-width:30px;}
  .queue-row .qmain{flex:1;min-width:0;display:flex;flex-wrap:wrap;column-gap:14px;row-gap:2px;align-items:baseline;}
  .queue-row .qname{font-family:var(--font-display);font-size:16.5px;}
  .queue-row .qdrink{color:var(--text-muted);font-size:13.5px;}
  .queue-row .qtime{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);white-space:nowrap;}
  .queue-row .qduration{font-family:var(--font-mono);font-size:11.5px;color:var(--gold);white-space:nowrap;}
  .queue-row.done{opacity:.55;}
  .queue-actions{display:flex;gap:8px;flex:0 0 auto;}

  .menu-edit-row{
    background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:16px;display:flex;gap:12px;margin-bottom:10px;align-items:flex-start;
  }
  .menu-edit-row .fields{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;}
  .field-label{font-size:10.5px;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase;font-family:var(--font-mono);}
  .menu-edit-row input[type=text], .menu-edit-row textarea{
    width:100%;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:9px 11px;font-family:var(--font-body);font-size:14.5px;resize:vertical;
  }
  .menu-edit-row input[type=text]:focus, .menu-edit-row textarea:focus{border-color:var(--gold-dim);}

  .qr-panel{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start;}
  .qr-box{
    background:#fff;padding:16px;border-radius:var(--radius-md);flex:0 0 auto;
    box-shadow:var(--shadow);
  }
  .qr-box img, .qr-box svg{display:block;width:220px;height:220px;shape-rendering:crispEdges;}
  .qr-info{flex:1;min-width:240px;}
  .qr-info h3{font-size:17px;margin-bottom:8px;}
  .qr-info p{color:var(--text-muted);font-size:13.5px;line-height:1.7;margin-bottom:14px;}
  .url-box{
    display:flex;gap:8px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;align-items:center;margin-bottom:14px;
  }
  .url-box code{flex:1;font-family:var(--font-mono);font-size:12.5px;color:var(--gold-bright);overflow-wrap:anywhere;}

  .host-empty{color:var(--text-faint);font-size:13.5px;padding:18px 0;text-align:center;border:1px dashed var(--line);border-radius:var(--radius-md);}
  .conn-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--status-done-fg);margin-right:6px;vertical-align:1px;}
  .conn-dot.off{background:var(--danger-bright);}

  @media (min-width: 720px){
    .queue-columns{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
  }
</style>
</head>
<body>
  <div id="toast-root"></div>
  <div id="app"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script>
  (function(){
    "use strict";

    /* =========================================================
       CONFIG
    ========================================================= */

          drinkName: v.drinkName,
          stars: v.stars,
          createdAt: v.createdAt || Date.now()
        };
      });
      render();
    }, function(err){
      connected = false;
      render();
      toast("連線失敗：" + (err && err.message ? err.message : "請檢查網路"), true);
    });

    /* =========================================================
       ACTIONS
    ========================================================= */
    function submitOrder(drinkId, drinkName){
      if(!guestName || !guestName.trim()){
        toast("請先輸入你的名字", true);
        return;
      }
      var localId = uid("pending-");
      myOrderIds.push(localId);
      sessionStorage.setItem("bar.myOrders", JSON.stringify(myOrderIds));
      toast("已送出「" + drinkName + "」🍸");
      ordersRef.add({
        guest: guestName.trim(),
        drinkId: drinkId,
        drinkName: drinkName,
        status: "pending",
        createdAt: Date.now()
      }).then(function(docRef){
        myOrderIds.push(docRef.id);
        myOrderIds = myOrderIds.filter(function(id){ return id !== localId; });
        sessionStorage.setItem("bar.myOrders", JSON.stringify(myOrderIds));
        render();
      }).catch(function(err){
        toast("送出失敗：" + (err && err.message ? err.message : "請再試一次"), true);
      });
    }

    function submitVote(drinkId, drinkName, stars){
      stars = Number(stars);
      if(!stars) return;
      var stars_label = "★".repeat(stars);
      toast("已為「" + drinkName + "」評分 " + stars_label);
      ratingsRef.add({
        drinkId: drinkId,
        drinkName: drinkName,
        stars: stars,
        createdAt: Date.now()
      }).catch(function(err){
        toast("評分送出失敗：" + (err && err.message ? err.message : "請再試一次"), true);
      });
    }

    function toggleOrder(orderId){
      var order = orders.find(function(o){ return o.id === orderId; });
      if(!order) return;
      var next = order.status === "pending" ? "done" : "pending";
      var patch = { status: next };
      if(next === "done"){
        patch.doneAt = Date.now();
      } else {
        /* 復原成製作中時清掉完成時間，下次再按完成會重新計時 */
        patch.doneAt = firebase.firestore.FieldValue.delete();
      }
      ordersRef.doc(orderId).update(patch).catch(function(err){
        toast("更新失敗：" + (err && err.message ? err.message : "請再試一次"), true);
      });
    }

    function formatDuration(ms){
      var totalSec = Math.max(0, Math.round(ms / 1000));
      var min = Math.floor(totalSec / 60);
      var sec = totalSec % 60;
      if(min === 0) return sec + " 秒";
      if(sec === 0) return min + " 分鐘";
      return min + " 分 " + sec + " 秒";
    }

    function resetOrders(){
      if(!confirm("確定要清空目前所有點單嗎？酒單本身不會被清除。")) return;
      ordersRef.get().then(function(snap){
        var batch = db.batch();
        snap.docs.forEach(function(d){ batch.delete(d.ref); });
        return batch.commit();
      }).then(function(){
        toast("已清空本場點單，可以開始新的一場了");
      }).catch(function(err){
        toast("清空失敗：" + (err && err.message ? err.message : "請再試一次"), true);
      });
    }

    function resetRatings(){
      if(!confirm("確定要清空所有滿意度評分紀錄嗎？酒單和點單不會受影響。")) return;
      ratingsRef.get().then(function(snap){
        var batch = db.batch();
        snap.docs.forEach(function(d){ batch.delete(d.ref); });
        return batch.commit();
      }).then(function(){
        toast("已清空滿意度評分紀錄，可以開始新的一場了");
      }).catch(function(err){
        toast("清空失敗：" + (err && err.message ? err.message : "請再試一次"), true);
      });
    }

    function resetTiming(){
      if(!confirm("確定要清除製作時間統計嗎？點單、酒單和滿意度評分都不會受影響。")) return;
      settingsRef.set({ timingResetAt: Date.now() }, { merge: true }).then(function(){
        toast("已清除製作時間統計，接下來完成的杯數會重新計算");
      }).catch(function(err){
        toast("清除失敗：" + (err && err.message ? err.message : "請再試一次"), true);
      });
    }

    function pinPress(d){

          showPinModal = false;

    function renderQueueTab(pending, done){

          + "</div>";
      }
      var pendingHtml = pending.length ? pending.map(function(o){ return row(o,false); }).join("") : '<div class="host-empty">目前沒有等待中的點單</div>';
      var doneHtml = done.length ? done.map(function(o){ return row(o,true); }).join("") : '<div class="host-empty">還沒有完成的點單</div>';
      return '<div class="queue-columns">'
        + '<div class="queue-section"><h2>等待製作 · ' + pending.length + '</h2><div class="queue-list">' + pendingHtml + "</div></div>"

    function renderRatingTab(){
      var header = '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;">'
        + '<h2 style="margin-bottom:0;">各酒款滿意度 · 共 ' + ratings.length + ' 筆評分</h2>'
        + '<button class="btn-ghost btn-sm" data-action="reset-ratings"' + (ratings.length ? "" : " disabled") + '>清除滿意度紀錄</button>'
        + "</div>";

      if(!ratings.length){
        return '<div class="queue-section">' + header + '<div class="host-empty">還沒有人投票，等客人喝完酒之後邀請他們評分吧</div></div>';
      }
      var stats = menu.map(function(m){
        var rs = ratings.filter(function(r){ return r.drinkId === m.id; });
        var count = rs.length;
        var sum = rs.reduce(function(a,r){ return a + (Number(r.stars) || 0); }, 0);
        var avg = count ? sum / count : 0;
        var c3 = rs.filter(function(r){ return Number(r.stars) === 3; }).length;
        var c2 = rs.filter(function(r){ return Number(r.stars) === 2; }).length;
        var c1 = rs.filter(function(r){ return Number(r.stars) === 1; }).length;
        return {name: m.name, count: count, avg: avg, c3: c3, c2: c2, c1: c1};
      });
      /* 也涵蓋已經從酒單刪除、但過去曾被評分過的酒款，避免資料被遺漏 */
      var knownIds = menu.map(function(m){ return m.name; });
      var orphanNames = {};
      ratings.forEach(function(r){ if(knownIds.indexOf(r.drinkName) === -1) orphanNames[r.drinkName] = true; });
      Object.keys(orphanNames).forEach(function(name){
        var rs = ratings.filter(function(r){ return r.drinkName === name; });
        var count = rs.length;
        var sum = rs.reduce(function(a,r){ return a + (Number(r.stars) || 0); }, 0);
        stats.push({
          name: name, count: count, avg: count ? sum/count : 0,
          c3: rs.filter(function(r){ return Number(r.stars)===3; }).length,
          c2: rs.filter(function(r){ return Number(r.stars)===2; }).length,
          c1: rs.filter(function(r){ return Number(r.stars)===1; }).length
        });
      });

      stats.sort(function(a,b){ if(b.avg !== a.avg) return b.avg - a.avg; return b.count - a.count; });

      var rowsHtml = stats.map(function(s){
        var pct = s.count ? Math.max((s.avg/3)*100, 4) : 0;
        var valueLabel = s.count ? s.avg.toFixed(1) : "—";
        return '<div class="rating-row">'
          + '<div class="rating-name">' + esc(s.name) + '</div>'
          + '<div class="rating-bar-track"><div class="rating-bar-fill" style="width:' + pct + '%"></div></div>'
          + '<div class="rating-value">' + valueLabel + ' ★</div>'
          + '<div class="rating-count">' + s.count + ' 票</div>'
          + '<div class="rating-breakdown">★★★ ×' + s.c3 + '　★★ ×' + s.c2 + '　★ ×' + s.c1 + '</div>'
          + "</div>";
      }).join("");

      return '<div class="queue-section">' + header
        + '<div class="rating-list">' + rowsHtml + "</div></div>";
    }

    function renderTimingTab(){
      var doneOrders = orders.filter(function(o){ return o.status === "done" && o.doneAt && o.doneAt > timingResetAt; });
      var header = '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;">'
        + '<h2 style="margin-bottom:0;">製作時間統計 · 共 ' + doneOrders.length + ' 杯</h2>'
        + '<button class="btn-ghost btn-sm" data-action="reset-timing"' + (doneOrders.length ? "" : " disabled") + '>清除製作時間統計</button>'
        + "</div>";
      if(!doneOrders.length){
        return '<div class="queue-section">' + header + '<div class="host-empty">還沒有完成任何一杯調酒，等第一杯做完就會開始統計製作時間</div></div>';
      }

      var durations = doneOrders.map(function(o){ return {order:o, ms: Math.max(0, o.doneAt - o.createdAt)}; });
      var totalCount = durations.length;
      var sumMs = durations.reduce(function(a,d){ return a + d.ms; }, 0);
      var avgMs = sumMs / totalCount;
      var fastest = durations.reduce(function(a,b){ return b.ms < a.ms ? b : a; });
      var slowest = durations.reduce(function(a,b){ return b.ms > a.ms ? b : a; });

      function tile(num, lbl){
        return '<div class="stat-tile"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>';
      }
      var tenderStats = '<h2 style="font-size:15px;color:var(--text-muted);letter-spacing:.05em;margin-bottom:12px;font-family:var(--font-mono);text-transform:uppercase;">調酒師整體效率</h2>'
        + '<div class="stat-row" style="padding:0 0 28px;">'
        + tile(totalCount, "已完成杯數")
        + tile(formatDuration(avgMs), "平均製作時間")
        + tile(formatDuration(fastest.ms), "最快一杯")
        + tile(formatDuration(slowest.ms), "最慢一杯")
        + "</div>";

      var sorted = durations.slice().sort(function(a,b){ return a.ms - b.ms; });
      var topFast = sorted.slice(0, 3);
      var topSlow = sorted.slice(-3).reverse();

      function leadRow(rank, d){
        return '<div class="lead-row">'
          + '<span class="lead-rank">#' + rank + '</span>'
          + '<span class="lead-drink">' + esc(d.order.drinkName) + '</span>'
          + '<span class="lead-guest">' + esc(d.order.guest) + '</span>'
          + '<span class="lead-time">' + formatDuration(d.ms) + '</span>'
          + "</div>";
      }
      var leaderboards = '<div class="queue-columns" style="margin-bottom:32px;">'
        + '<div class="queue-section"><h2>最快完成 TOP ' + topFast.length + '</h2><div class="rating-list">'
        + topFast.map(function(d,i){ return leadRow(i+1, d); }).join("") + '</div></div>'
        + '<div class="queue-section"><h2>最慢完成 TOP ' + topSlow.length + '</h2><div class="rating-list">'
        + topSlow.map(function(d,i){ return leadRow(i+1, d); }).join("") + '</div></div>'
        + "</div>";

      var perDrink = menu.map(function(m){
        var ds = durations.filter(function(d){ return d.order.drinkId === m.id; });
        return statFor(m.name, ds);
      });
      var knownNames = menu.map(function(m){ return m.name; });
      var orphanNames = {};
      durations.forEach(function(d){ if(knownNames.indexOf(d.order.drinkName) === -1) orphanNames[d.order.drinkName] = true; });
      Object.keys(orphanNames).forEach(function(name){
        var ds = durations.filter(function(d){ return d.order.drinkName === name; });
        perDrink.push(statFor(name, ds));
      });
      function statFor(name, ds){
        var count = ds.length;
        var sum = ds.reduce(function(a,d){ return a + d.ms; }, 0);
        var avg = count ? sum / count : 0;
        var min = count ? Math.min.apply(null, ds.map(function(d){ return d.ms; })) : 0;
        var max = count ? Math.max.apply(null, ds.map(function(d){ return d.ms; })) : 0;
        return {name:name, count:count, avg:avg, min:min, max:max};
      }
      perDrink = perDrink.filter(function(s){ return s.count > 0; });
      perDrink.sort(function(a,b){ return b.avg - a.avg; });
      var maxAvg = perDrink.length ? perDrink[0].avg : 0;

      var perDrinkHtml = perDrink.map(function(s){
        var pct = maxAvg ? Math.max((s.avg / maxAvg) * 100, 4) : 0;
        return '<div class="rating-row">'
          + '<div class="rating-name">' + esc(s.name) + '</div>'
          + '<div class="rating-bar-track"><div class="rating-bar-fill" style="width:' + pct + '%"></div></div>'
          + '<div class="rating-value">' + formatDuration(s.avg) + '</div>'
          + '<div class="rating-count">' + s.count + ' 杯</div>'
          + '<div class="rating-breakdown">最快 ' + formatDuration(s.min) + '　最慢 ' + formatDuration(s.max) + '</div>'
          + "</div>";
      }).join("");

      var perDrinkSection = '<div class="queue-section"><h2>每杯調酒製作時間分析</h2><div class="rating-list">' + perDrinkHtml + "</div></div>";

      return '<div class="queue-section">' + header + "</div>" + tenderStats + leaderboards + perDrinkSection;
    }

    function renderShareTab(){
      var qrHtml = QR_SVG
        ? '<div class="qr-box">' + QR_SVG + '</div>'
        : '<div class="qr-box" style="width:220px;height:220px;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;">QR Code 產生中</div>';
      var urlText = SITE_URL || "（部署後這裡會顯示網址）";
      return '<div class="qr-panel">' + qrHtml
        + '<div class="qr-info"><h3>把這個 QR Code 印出來或投影出來</h3>'
        + '<p>客人掃描後會直接打開點酒頁面，不需要安裝任何 App、不需要登入任何帳號，也不需要跟你連同一個 Wi-Fi — 只要有網路就能點酒，帶去任何地方都能用。</p>'
        + '<div class="url-box"><code>' + esc(urlText) + '</code></div>'
        + '<p>下次辦活動前，先按上方「重置點單」清空點單紀錄，酒單可以隨時在「編輯酒單」調整，QR Code 和網址不需要重新產生。</p>'
        + "</div></div>";
    }

    /* =========================================================
       MAIN RENDER
    ========================================================= */
    function render(){
      var appEl = document.getElementById("app");
      appEl.innerHTML = role === "host" ? renderHostView() : renderGuestView();
    }

    /* =========================================================
       EVENT DELEGATION
    ========================================================= */
    document.addEventListener("click", function(e){
      if(e.target.classList && e.target.classList.contains("modal-backdrop")){
        closePinModal();
        return;
      }
      var t = e.target.closest("[data-action]");
      if(!t) return;
      var action = t.getAttribute("data-action");
      switch(action){
        case "order":
          submitOrder(t.getAttribute("data-id"), t.getAttribute("data-name"));
          break;
        case "edit-name":
          guestName = "";
          sessionStorage.removeItem("bar.guestName");
          render();
          break;
        case "open-host":
          openPinModal();
          break;
        case "pin-cancel":
          closePinModal();
          break;
        case "pin-back":
          pinBackspace();
          break;
        case "pin-press":
          pinPress(t.getAttribute("data-digit"));
          break;
        case "logout-host":
          logoutHost();
          break;
        case "reset-orders":
          resetOrders();
          break;
        case "reset-ratings":
          resetRatings();
          break;
        case "reset-timing":
          resetTiming();
          break;
        case "host-tab":
          setHostTab(t.getAttribute("data-tab"));
          break;
        case "draft-add":
          draftAddItem();
          break;
        case "draft-remove":
          draftRemoveItem(t.getAttribute("data-id"));
          break;
        case "save-menu":
          saveMenu();
          break;
        case "cancel-edit-menu":
          cancelEditMenu();
          break;
        case "toggle-order":
          toggleOrder(t.getAttribute("data-id"));
          break;
      }
    });

    document.addEventListener("change", function(e){
      var t = e.target.closest("[data-action-change]");
      if(!t) return;
      var action = t.getAttribute("data-action-change");
      if(action === "vote"){
        var stars = t.value;
        if(!stars) return;
        submitVote(t.getAttribute("data-id"), t.getAttribute("data-name"), stars);
        t.value = "";
      }
    });

    document.addEventListener("submit", function(e){
      var t = e.target.closest("[data-action-submit]");
      if(!t) return;
      e.preventDefault();
      var action = t.getAttribute("data-action-submit");
      if(action === "save-name"){
        var v = document.getElementById("name-input").value.trim();
        if(!v) return;
        guestName = v;
        sessionStorage.setItem("bar.guestName", v);
        render();
      }
    });

    /* =========================================================
       INIT
    ========================================================= */
    render();
  })();
  </script>
</body>
</html>
